</style></head><body><header><a href="/order/">← Grill Time</a><button id="lang" onclick="changeLang()">EN</button></header><main><h1 id="heading">Je bestelling volgen</h1><div class="card"><div id="number" class="number">...</div><p id="details" class="muted"></p><div id="state" class="state">Bestelling laden…</div><p id="eta" class="muted"></p><div id="review" class="hidden"><a href="https://search.google.com/local/writereview?placeid=ChIJOUHpWQCp3EcR7-XFnqo-UyY" target="_blank" rel="noopener">Deel je ervaring op Google</a></div></div><p class="muted"><a href="tel:+32490396181">Grill Time bellen: 0490 39 61 81</a></p></main>
<script>
let lang=localStorage.getItem('gt-lang')==='en'?'en':'nl',order=null;
const q=new URLSearchParams(location.search),token=q.get('token'),session=q.get('session_id');
function changeLang(){lang=lang==='en'?'nl':'en';localStorage.setItem('gt-lang',lang);render()}
function tr(nl,en){return lang==='en'?en:nl}
function render(){document.documentElement.lang=lang;document.getElementById('lang').textContent=lang==='en'?'NL':'EN';document.getElementById('heading').textContent=tr('Je bestelling volgen','Track your order');document.getElementById('review').querySelector('a').textContent=tr('Deel je ervaring op Google','Share your experience on Google');if(!order)return;document.getElementById('number').textContent='GT-'+String(order.orderNumber).padStart(5,'0');document.getElementById('details').textContent=[order.orderType==='delivery'?tr('Bezorging','Delivery'):tr('Afhalen','Pick-up'),order.requestedTime||'',new Intl.NumberFormat(lang==='en'?'en-BE':'nl-BE',{style:'currency',currency:'EUR'}).format(order.totalCents/100)].filter(Boolean).join(' · ');const statuses={new:[tr('Bestelling ontvangen! Wacht even op de bevestiging van Grill Time.','Order received! Please wait for Grill Time to confirm it.'),false],accepted:[tr('Bestelling bevestigd.','Order confirmed.'),false],preparing:[tr('Je bestelling wordt bereid.','Your order is being prepared.'),false],ready:[tr('Je bestelling is klaar.','Your order is ready.'),false],on_way:[tr('Je bestelling is onderweg. Smakelijk!','Your order is on its way. Enjoy!'),false],completed:[tr('Bestelling afgerond. Bedankt!','Order completed. Thank you!'),true],rejected:[tr('Bestelling geweigerd. Neem contact op met Grill Time.','Order declined. Contact Grill Time.'),false],cancelled:[tr('Bestelling geannuleerd.','Order cancelled.'),false]};const current=statuses[order.status]||[tr('Status wordt bijgewerkt.','Status is updating.'),false];document.getElementById('state').textContent=current[0];document.getElementById('eta').textContent=order.orderType==='delivery'&&['new','accepted','preparing','on_way'].includes(order.status)?tr('Geschatte bezorgtijd: 25–45 minuten.','Estimated delivery time: 25–45 minutes.'):'';document.getElementById('review').classList.toggle('hidden',!current[1])}
async function refresh(){if(!token&&!session){document.getElementById('state').textContent=tr('Geen geldige bestellink.','No valid order link.');return}try{const params=new URLSearchParams(token?{token}:{session_id:session});const r=await fetch('https://qpaycwrhohunpfjqmlga.supabase.co/functions/v1/order-status?'+params,{headers:{apikey:'sb_publishable_lEAgOU350gcdQdI_zYVDAQ_6p7uNeYM'},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Status niet beschikbaar');order=d;render()}catch(e){document.getElementById('state').textContent=e.message||tr('Status tijdelijk niet beschikbaar.','Status temporarily unavailable.')}}
render();refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></body></html>
