    main{max-width:1120px;margin:auto;padding:10px 18px 38px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-title h3{margin:0;font-size:24px;color:var(--gold)}.section-title span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid #292929;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,#262626,#111)}.no-photo{display:grid;place-items:center;color:#777;font-size:42px;position:relative}.no-photo:after{content:'Foto volgt';position:absolute;bottom:14px;font-size:12px;color:#999}.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.card h4{font-size:17px;margin:0}.desc{font-size:13px;line-height:1.45;color:var(--muted);margin:0;min-height:38px}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.price{font-size:19px;color:var(--gold);font-weight:900}.add{border:0;background:var(--gold);color:#111;font-weight:900;border-radius:11px;padding:10px 13px}.empty{text-align:center;color:var(--muted);padding:55px 10px}
    .deal-card{border-color:#73541f;box-shadow:0 0 0 1px rgba(245,180,75,.08)}.deal-card h4:before{content:'🔥 ';}.best{font-size:11px;background:#2d2516;border:1px solid #5e4c25;color:#ffe3a5;border-radius:999px;padding:4px 7px;display:inline-block;width:max-content}
    .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#080808 28%)}.cartbtn{max-width:740px;margin:auto;width:100%;border:0;border-radius:16px;background:var(--gold);color:#111;padding:15px 18px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.badge{min-width:28px;height:28px;border-radius:999px;background:#111;color:#fff;display:grid;place-items:center;padding:0 8px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#151515;border:1px solid #2a2a2a;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.sheet h3{margin:0;color:var(--gold);font-size:25px}.close{border:1px solid #383838;background:#222;color:#fff;border-radius:10px;width:40px;height:40px;font-size:22px}.details{color:var(--muted);font-size:13px;line-height:1.45}.option-group{border-top:1px solid #292929;padding-top:15px;margin-top:15px}.option-group h4{margin:0 0 5px;font-size:16px}.option-list{display:grid;gap:8px;margin-top:10px}.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1d1d1d;border:1px solid #303030;border-radius:12px;padding:11px 12px}.choice label{display:flex;align-items:center;gap:10px;flex:1}.choice input{accent-color:var(--gold);width:18px;height:18px}.qtyrow{display:flex;align-items:center;justify-content:space-between;margin:19px 0 8px}.stepper{display:flex;align-items:center;gap:12px}.stepper button,.mini-step button{border:1px solid #383838;background:#222;color:#fff;border-radius:10px}.stepper button{width:40px;height:40px;font-size:22px}.primary{width:100%;border:0;border-radius:14px;background:var(--gold);color:#111;padding:15px;font-weight:900;font-size:16px}.primary:disabled{opacity:.5}.cart-item{border-bottom:1px solid #292929;padding:14px 0}.cart-item-top{display:flex;justify-content:space-between;gap:12px}.cart-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.mini-step{display:flex;gap:8px;align-items:center}.mini-step button{width:32px;height:32px}.remove{border:0;background:transparent;color:#ff8c8c;padding:6px 0}.totals{padding:16px 0 4px}.grand{display:flex;justify-content:space-between;font-size:21px;font-weight:900;border-top:1px solid #333;padding-top:12px}.notice{background:#1c241d;border:1px solid #334a36;color:#cdebd1;border-radius:12px;padding:11px 12px;font-size:13px;margin:12px 0}.warning{background:#2a2315;border:1px solid #574724;color:#ffe4a4}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-weight:800;z-index:60;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid #393939;background:#1d1d1d;color:#ddd;border-radius:12px;padding:12px;font-weight:800}.seg button.active{background:var(--gold);border-color:var(--gold);color:#111}.checkout-grid{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:#ddd;font-weight:700}.field input,.field textarea{width:100%;background:#1c1c1c;border:1px solid #363636;border-radius:12px;color:#fff;padding:12px 13px;outline:none}.field textarea{min-height:80px}.order-summary{border:1px solid #333;border-radius:14px;padding:13px;background:#191919;margin:14px 0}.order-summary .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.success{text-align:center}.success-icon{width:62px;height:62px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:#183b25;color:#7ff0a1;font-size:30px}.order-no{font-size:30px;color:var(--gold);font-weight:900;margin:8px 0}
    @media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.sheet{border-radius:24px;margin-bottom:18px}.overlay{align-items:center}.checkout-grid.two{grid-template-columns:1fr 1fr}.photo{aspect-ratio:16/11}}

<body>
<header class="top"><div class="top-inner"><div class="brand"><div class="logo">GT</div><div><h1>Grill Time Oostende</h1><small>Direct online bestellen</small></div></div><div id="status" class="status">● Laden…</div></div></header>
<section class="hero"><h2>Bestel direct bij <span>Grill Time</span></h2><p>Pizza, Grill Time Classics, sides en online deals. Kies je opties en betaal veilig online.</p><div class="launch">Regular pizza vanaf €10,99</div></section>
<section class="controls"><input id="search" class="search" type="search" placeholder="Zoek pizza, kapsalon, durum…" autocomplete="off"><div id="categories" class="cats"></div></section>
<main id="menu"><div class="empty">Menu laden…</div></main>
<div class="cartbar"><button id="openCart" class="cartbtn" type="button"><span style="display:flex;align-items:center;gap:10px"><span id="cartCount" class="badge">0</span> Winkelmandje</span><span id="cartTotal">€0,00</span></button></div>
<div id="productOverlay" class="overlay"><div id="productSheet" class="sheet"></div></div>
<div id="cartOverlay" class="overlay"><div id="cartSheet" class="sheet"></div></div>
<div id="checkoutOverlay" class="overlay"><div id="checkoutSheet" class="sheet"></div></div>
<div id="successOverlay" class="overlay"><div id="successSheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
const CFG={url:'https://qpaycwrhohunpfjqmlga.supabase.co',key:'sb_publishable_lEAgOU350gcdQdI_zYVDAQ_6p7uNeYM'};
const H={'apikey':CFG.key,'Content-Type':'application/json'};
const CAT_ORDER=['Online Deals','Pizza','Grill Time Classics','Sides','Drinks'];
let products=[],groups={},links={},cart=JSON.parse(localStorage.getItem('gt-cart-v4')||'[]'),selected=null,currentQty=1,activeCategory='Alles',orderType='pickup';
const euro=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)};
function toggle(id,on){document.getElementById(id).classList.toggle('open',on)}
function save(){localStorage.setItem('gt-cart-v4',JSON.stringify(cart));renderCartBar()}
async function get(path){const r=await fetch(CFG.url+path,{headers:H});const b=await r.json();if(!r.ok)throw new Error(b?.message||b?.error||`HTTP ${r.status}`);return b}
function imageFor(p){let x=p.image_path||'';if(!x)return'';if(x.startsWith('../assets/images/'))x='../'+x.split('/').pop();return x}
async function loadMenu(){try{
  const [ps,ls,gs,vs]=await Promise.all([
    get('/rest/v1/products?select=id,category,name,description,price_cents,image_path,sort_order&active=eq.true&order=sort_order.asc'),
    get('/rest/v1/product_option_groups?select=product_id,group_id,sort_order&order=sort_order.asc'),
    get('/rest/v1/option_groups?select=id,title,subtitle,input_type,required,max_select,display_prefix,sort_order&order=sort_order.asc'),
    get('/rest/v1/option_values?select=group_id,label,price_delta_cents,active,sort_order&active=eq.true&order=sort_order.asc')
  ]);
  const valuesBy={};vs.forEach(v=>(valuesBy[v.group_id]??=[]).push(v));
  groups={};gs.forEach(g=>groups[g.id]={...g,values:valuesBy[g.id]||[]});
  links={};ls.forEach(l=>(links[l.product_id]??=[]).push(l.group_id));
  products=ps.map(p=>({...p,price:p.price_cents/100,image:imageFor(p),options:links[p.id]||[]}));
  const valid=new Set(products.map(p=>p.id));cart=cart.filter(l=>valid.has(l.productId));save();
  document.getElementById('status').textContent='● Online';renderCategories();renderMenu();
}catch(e){console.error(e);document.getElementById('status').textContent='● Fout';document.getElementById('menu').innerHTML='<div class="empty">Menu kon niet geladen worden. Vernieuw de pagina.</div>'}}
function renderCategories(){const present=new Set(products.map(p=>p.category));const cats=['Alles',...CAT_ORDER.filter(c=>present.has(c))];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="cat ${c===activeCategory?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();renderMenu()})}
function renderMenu(){const q=document.getElementById('search').value.trim().toLowerCase();let list=products.filter(p=>(activeCategory==='Alles'||p.category===activeCategory)&&(!q||`${p.name} ${p.description||''} ${p.category}`.toLowerCase().includes(q)));if(!list.length){document.getElementById('menu').innerHTML='<div class="empty">Geen gerechten gevonden.</div>';return}const cats=CAT_ORDER.filter(c=>list.some(p=>p.category===c));document.getElementById('menu').innerHTML=cats.map(c=>{const ps=list.filter(p=>p.category===c);return`<section><div class="section-title"><h3>${esc(c)}</h3><span>${ps.length} items</span></div><div class="grid">${ps.map(card).join('')}</div></section>`}).join('');document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(b.dataset.product))}
function card(p){const deal=p.category==='Online Deals';const bestseller=['loaded-doner-pizza','scampi-pizza'].includes(p.id);return`<article class="card ${deal?'deal-card':''}">${p.image?`<img class="photo" src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.outerHTML='<div class=\'photo no-photo\'>🍽️</div>'">`:`<div class="photo no-photo">🍽️</div>`}<div class="card-body">${bestseller?'<span class="best">⭐ Bestseller</span>':''}<h4>${esc(p.name)}</h4><p class="desc">${esc(p.description||'')}</p><div class="card-bottom"><span class="price">${euro(p.price)}</span><button class="add" data-product="${esc(p.id)}">Toevoegen</button></div></div></article>`}
function renderOption(key,idx){const g=groups[key];if(!g)return'';const type=g.input_type==='radio'?'radio':'checkbox';return`<div class="option-group" data-group="${esc(key)}"><h4>${esc(g.title)} ${g.required?'<span style="color:#ffb0b0">*</span>':''}</h4>${g.subtitle?`<div class="details">${esc(g.subtitle)}</div>`:''}<div class="option-list">${g.values.map((v,n)=>`<div class="choice"><label><input type="${type}" name="o-${idx}-${esc(key)}" value="${esc(v.label)}" data-price="${Number(v.price_delta_cents||0)/100}"><span>${esc(g.display_prefix||'')}${esc(v.label)}</span></label><span>${v.price_delta_cents?`+ ${euro(v.price_delta_cents/100)}`:''}</span></div>`).join('')}</div></div>`}
function openProduct(id){selected=products.find(p=>p.id===id);currentQty=1;if(!selected)return;document.getElementById('productSheet').innerHTML=`<div class="sheet-head"><div><h3>${esc(selected.name)}</h3><div class="price" id="modalPrice">${euro(selected.price)}</div></div><button class="close" onclick="toggle('productOverlay',false)">×</button></div><p class="details">${esc(selected.description||'')}</p><div id="optionArea">${selected.options.map((k,i)=>renderOption(k,i)).join('')}</div><div class="qtyrow"><strong>Aantal</strong><div class="stepper"><button onclick="qty(-1)">−</button><strong id="qty">1</strong><button onclick="qty(1)">+</button></div></div><button id="addSelected" class="primary" onclick="addSelected()">Toevoegen · ${euro(selected.price)}</button>`;document.querySelectorAll('#optionArea input').forEach(i=>i.onchange=()=>{enforceMax(i);updateModalPrice()});toggle('productOverlay',true)}
function enforceMax(input){const w=input.closest('[data-group]');const g=groups[w?.dataset.group];if(!g?.max_select||!input.checked)return;const checked=[...w.querySelectorAll('input:checked')];if(checked.length>g.max_select){input.checked=false;toast(`Maximaal ${g.max_select} kiezen`)}}
function currentSelections(){const out=[];document.querySelectorAll('#optionArea [data-group]').forEach(w=>{const key=w.dataset.group,g=groups[key],chosen=[...w.querySelectorAll('input:checked')].map(i=>({raw:i.value,label:(g.display_prefix||'')+i.value,extra:Number(i.dataset.price||0)}));out.push({key,title:g.title,chosen})});return out}
function extra(){return currentSelections().flatMap(g=>g.chosen).reduce((s,x)=>s+x.extra,0)}
function qty(d){currentQty=Math.max(1,currentQty+d);document.getElementById('qty').textContent=currentQty;updateModalPrice()}
function updateModalPrice(){const v=(selected.price+extra())*currentQty;document.getElementById('modalPrice').textContent=euro(v);document.getElementById('addSelected').textContent=`Toevoegen · ${euro(v)}`}
function addSelected(){const sels=currentSelections();for(const key of selected.options){const g=groups[key];if(g?.required&&!sels.find(x=>x.key===key)?.chosen.length){toast(`Kies eerst: ${g.title}`);return}}cart.push({lineId:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,productId:selected.id,name:selected.name,qty:currentQty,selections:sels,unitPrice:selected.price+extra()});save();toggle('productOverlay',false);toast(`${selected.name} toegevoegd`)}
function cartTotal(){return cart.reduce((s,l)=>s+l.unitPrice*l.qty,0)}function renderCartBar(){document.getElementById('cartCount').textContent=cart.reduce((s,l)=>s+l.qty,0);document.getElementById('cartTotal').textContent=euro(cartTotal())}
function lineDetails(l){return l.selections.filter(g=>g.chosen.length).map(g=>`${esc(g.title)}: ${g.chosen.map(x=>esc(x.label)).join(', ')}`).join('<br>')||'Standaard'}
function openCart(){const s=document.getElementById('cartSheet');if(!cart.length){s.innerHTML=`<div class="sheet-head"><h3>Winkelmandje</h3><button class="close" onclick="toggle('cartOverlay',false)">×</button></div><div class="empty">Je winkelmandje is leeg.</div>`;toggle('cartOverlay',true);return}s.innerHTML=`<div class="sheet-head"><h3>Winkelmandje</h3><button class="close" onclick="toggle('cartOverlay',false)">×</button></div>${cart.map((l,i)=>`<div class="cart-item"><div class="cart-item-top"><div><strong>${l.qty}× ${esc(l.name)}</strong><div class="details">${lineDetails(l)}</div></div><strong>${euro(l.qty*l.unitPrice)}</strong></div><div class="cart-actions"><button class="remove" onclick="removeLine(${i})">Verwijderen</button><div class="mini-step"><button onclick="lineQty(${i},-1)">−</button><strong>${l.qty}</strong><button onclick="lineQty(${i},1)">+</button></div></div></div>`).join('')}<div class="totals"><div class="grand"><span>Totaal</span><span>${euro(cartTotal())}</span></div></div><button class="primary" onclick="openCheckout()">Doorgaan</button>`;toggle('cartOverlay',true)}
function removeLine(i){cart.splice(i,1);save();openCart()}function lineQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();openCart()}
function openCheckout(){toggle('cartOverlay',false);renderCheckout();toggle('checkoutOverlay',true)}function setType(t){orderType=t;renderCheckout()}
function renderCheckout(){document.getElementById('checkoutSheet').innerHTML=`<div class="sheet-head"><div><h3>Checkout</h3><div class="details">Bestelling afronden</div></div><button class="close" onclick="toggle('checkoutOverlay',false)">×</button></div><div class="seg"><button class="${orderType==='pickup'?'active':''}" onclick="setType('pickup')">Afhalen</button><button class="${orderType==='delivery'?'active':''}" onclick="setType('delivery')">Bezorgen</button></div><form id="checkoutForm" onsubmit="submitOrder(event)"><div class="checkout-grid two" style="margin-top:14px"><div class="field"><label>Naam *</label><input name="name" required></div><div class="field"><label>Telefoon *</label><input name="phone" required></div></div><div class="checkout-grid two ${orderType==='pickup'?'hidden':''}" style="margin-top:12px"><div class="field"><label>Adres *</label><input name="address"></div><div class="field"><label>Postcode / gemeente *</label><input name="city"></div></div><div class="checkout-grid two" style="margin-top:12px"><div class="field"><label>${orderType==='pickup'?'Afhaaltijd':'Bezorgtijd'}</label><input name="requestedTime" type="time"></div><div class="field"><label>E-mail</label><input name="email" type="email"></div></div><div class="field" style="margin-top:12px"><label>Opmerking</label><textarea name="notes"></textarea></div><div class="order-summary">${cart.map(l=>`<div class="row"><span>${l.qty}× ${esc(l.name)}</span><strong>${euro(l.qty*l.unitPrice)}</strong></div>`).join('')}<div class="row" style="border-top:1px solid #333;margin-top:7px;padding-top:10px"><strong>Totaal</strong><strong>${euro(cartTotal())}</strong></div></div><div class="notice">Je wordt doorgestuurd naar de beveiligde betaalpagina van Stripe.</div><button id="checkoutSubmit" class="primary" type="submit">Naar betaling · ${euro(cartTotal())}</button></form>`}
function payload(){const f=new FormData(document.getElementById('checkoutForm'));return{customer:{name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),email:String(f.get('email')||'').trim()||null},orderType,address:orderType==='delivery'?String(f.get('address')||'').trim():null,city:orderType==='delivery'?String(f.get('city')||'').trim():null,requestedTime:f.get('requestedTime')||null,notes:String(f.get('notes')||'').trim()||null,items:cart.map(l=>({productId:l.productId,qty:l.qty,selectedOptions:Object.fromEntries(l.selections.map(g=>[g.key,g.chosen.map(x=>x.raw)]))}))}}
async function submitOrder(e){e.preventDefault();if(!cart.length)return;const p=payload();if(orderType==='delivery'&&(!p.address||!p.city)){toast('Vul het bezorgadres in');return}const b=document.getElementById('checkoutSubmit');b.disabled=true;b.textContent='Betaling voorbereiden…';try{const r=await fetch(CFG.url+'/functions/v1/create-checkout',{method:'POST',headers:H,body:JSON.stringify(p)});const d=await r.json();if(!r.ok||!d.checkoutUrl)throw new Error(d.error||'Checkout mislukt');location.assign(d.checkoutUrl)}catch(e){console.error(e);toast(e.message||'Betaling kon niet starten');b.disabled=false;b.textContent=`Naar betaling · ${euro(cartTotal())}`}}
async function handlePaymentReturn(){const q=new URLSearchParams(location.search),state=q.get('payment');if(state==='cancelled'){toast('Betaling geannuleerd · winkelmandje is bewaard');history.replaceState({},'',location.pathname);return}if(state!=='success')return;const sid=q.get('session_id');if(!sid)return;document.getElementById('successSheet').innerHTML='<div class="success"><div class="success-icon">⌛</div><h3>Betaling controleren…</h3></div>';toggle('successOverlay',true);try{const r=await fetch(CFG.url+'/functions/v1/order-status?session_id='+encodeURIComponent(sid),{headers:H});const o=await r.json();if(!r.ok||o.paymentStatus!=='paid')throw new Error(o.error||'Betaling nog niet bevestigd');cart=[];save();document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">✓</div><h3>Betaling ontvangen</h3><div class="order-no">GT-${String(o.orderNumber).padStart(5,'0')}</div><p class="details">${esc(o.customerName)} · ${o.orderType==='pickup'?'Afhalen':'Bezorgen'} · ${euro(o.totalCents/100)}</p><div class="notice">Je bestelling staat nu in het restaurantdashboard.</div><button class="primary" onclick="toggle('successOverlay',false)">Klaar</button></div>`;history.replaceState({},'',location.pathname)}catch(e){document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">!</div><h3>Betaling wordt verwerkt</h3><p class="details">${esc(e.message)}</p><div class="notice warning">Stripe verwerkt de betaling automatisch verder.</div></div>`}}
['productOverlay','cartOverlay','checkoutOverlay','successOverlay'].forEach(id=>document.getElementById(id).onclick=e=>{if(e.target.id===id)toggle(id,false)});document.getElementById('openCart').onclick=openCart;document.getElementById('search').oninput=renderMenu;renderCartBar();loadMenu();handlePaymentReturn();
</script>
</body>
