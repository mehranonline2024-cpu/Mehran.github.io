<script>

function openProduct(id){selected=products.find(p=>p.id===id);currentQty=1;if(!selected)return;const sheet=document.getElementById('productSheet');sheet.innerHTML=`<div class="sheet-head"><div><h3>${esc(selected.name)}</h3><div class="price" id="modalPrice">${euro(selected.price)}</div></div><button class="close" onclick="toggle('productOverlay',false)">×</button></div><p class="details">${esc(selected.desc)}</p><div id="optionArea">${(selected.options||[]).map((key,i)=>renderOption(key,i)).join('')}</div><div class="qtyrow"><strong>Aantal</strong><div class="stepper"><button type="button" onclick="qty(-1)">−</button><strong id="qty">1</strong><button type="button" onclick="qty(1)">+</button></div></div><button type="button" class="primary" onclick="addSelected()" id="addSelected">Toevoegen · ${euro(selected.price)}</button>`;sheet.querySelectorAll('input').forEach(i=>i.onchange=()=>{enforceMax(i);updateModalPrice()});toggle('productOverlay',true)}
function renderOption(key,idx){const g=options[key];if(!g)return'';const type=g.type==='radio'?'radio':'checkbox';return`<div class="option-group" data-group="${esc(key)}"><h4>${esc(g.title)} ${g.required?'<span style="color:#ffb0b0">*</span>':''}</h4>${g.subtitle?`<small>${esc(g.subtitle)}</small>`:''}<div class="option-list">${g.items.map((it,n)=>{const name=`o-${idx}-${key}`;const value=it[0],extra=Number(it[1]||0);return`<div class="choice"><label><input ${g.required&&n===0?'checked':''} type="${type}" name="${esc(name)}" value="${esc(value)}" data-price="${extra}"><span>${esc(g.prefix||'')}${esc(value)}</span></label><span>${extra?`+ ${euro(extra)}`:''}</span></div>`}).join('')}</div></div>`}
function enforceMax(input){const wrap=input.closest('[data-group]');if(!wrap)return;const g=options[wrap.dataset.group];if(!g?.max||!input.checked)return;const ch=[...wrap.querySelectorAll('input:checked')];if(ch.length>g.max){input.checked=false;showToast(`Maximaal ${g.max} kiezen`)}}
function currentSelections(){const groups=[];document.querySelectorAll('#optionArea [data-group]').forEach(w=>{const key=w.dataset.group,g=options[key],chosen=[...w.querySelectorAll('input:checked')].map(i=>({label:(g.prefix||'')+i.value,raw:i.value,extra:Number(i.dataset.price||0)}));groups.push({key,title:g.title,chosen})});return groups}
function optionExtra(){return currentSelections().flatMap(g=>g.chosen).reduce((s,x)=>s+x.extra,0)}function qty(d){currentQty=Math.max(1,currentQty+d);document.getElementById('qty').textContent=currentQty;updateModalPrice()}function updateModalPrice(){const v=(selected.price+optionExtra())*currentQty;document.getElementById('modalPrice').textContent=euro(v);document.getElementById('addSelected').textContent=`Toevoegen · ${euro(v)}`}
function addSelected(){const sels=currentSelections();for(const key of(selected.options||[])){const g=options[key];if(g?.required&&!sels.find(x=>x.key===key)?.chosen.length){showToast(`Kies eerst: ${g.title}`);return}}cart.push({lineId:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,productId:selected.id,name:selected.name,basePrice:selected.price,qty:currentQty,selections:sels,unitPrice:selected.price+optionExtra()});save();toggle('productOverlay',false);showToast(`${selected.name} toegevoegd`)}
function cartTotal(){return cart.reduce((s,l)=>s+l.unitPrice*l.qty,0)}function renderCartBar(){const n=cart.reduce((s,l)=>s+l.qty,0);document.getElementById('cartCount').textContent=n;document.getElementById('cartTotal').textContent=euro(cartTotal())}
function openCart(){const s=document.getElementById('cartSheet');if(!cart.length){s.innerHTML=`<div class="sheet-head"><h3>Winkelmandje</h3><button class="close" onclick="toggle('cartOverlay',false)">×</button></div><div class="empty-state">Je winkelmandje is nog leeg.</div>`;toggle('cartOverlay',true);return}s.innerHTML=`<div class="sheet-head"><h3>Winkelmandje</h3><button class="close" onclick="toggle('cartOverlay',false)">×</button></div>${cart.map((l,i)=>`<div class="cart-item"><div class="cart-item-top"><div><strong>${l.qty}× ${esc(l.name)}</strong><div class="details">${lineDetails(l)}</div></div><strong>${euro(l.unitPrice*l.qty)}</strong></div><div class="cart-actions"><button class="remove" onclick="removeLine(${i})">Verwijderen</button><div class="mini-step"><button onclick="lineQty(${i},-1)">−</button><strong>${l.qty}</strong><button onclick="lineQty(${i},1)">+</button></div></div></div>`).join('')}<div class="totals"><div class="total-line grand"><span>Totaal</span><span>${euro(cartTotal())}</span></div></div><button class="primary" onclick="openCheckout()">Doorgaan</button>`;toggle('cartOverlay',true)}
function lineDetails(l){return l.selections.filter(g=>g.chosen.length).map(g=>`${esc(g.title)}: ${g.chosen.map(x=>esc(x.label)).join(', ')}`).join('<br>')||'Standaard'}function removeLine(i){cart.splice(i,1);save();openCart()}function lineQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();openCart()}
function openCheckout(){toggle('cartOverlay',false);renderCheckout();toggle('checkoutOverlay',true)}
function renderCheckout(){document.getElementById('checkoutSheet').innerHTML=`<div class="sheet-head"><div><h3>Checkout</h3><div class="details">Bestelling afronden</div></div><button class="close" onclick="toggle('checkoutOverlay',false)">×</button></div><div class="seg"><button type="button" id="pickupBtn" class="${orderType==='pickup'?'active':''}" onclick="setType('pickup')">Afhalen</button><button type="button" id="deliveryBtn" class="${orderType==='delivery'?'active':''}" onclick="setType('delivery')">Bezorgen</button></div><form id="checkoutForm" onsubmit="submitOrder(event)"><div class="checkout-grid two" style="margin-top:14px"><div class="field"><label>Naam *</label><input name="name" required autocomplete="name"></div><div class="field"><label>Telefoon *</label><input name="phone" required autocomplete="tel"></div></div><div id="deliveryFields" class="checkout-grid two ${orderType==='pickup'?'hidden':''}" style="margin-top:12px"><div class="field"><label>Adres *</label><input name="address" autocomplete="street-address"></div><div class="field"><label>Postcode / gemeente *</label><input name="city"></div></div><div class="checkout-grid two" style="margin-top:12px"><div class="field"><label>${orderType==='pickup'?'Afhaaltijd':'Bezorgtijd'}</label><input name="requestedTime" type="time"></div><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="email"></div></div><div class="field" style="margin-top:12px"><label>Opmerking</label><textarea name="notes" placeholder="Bijv. bel bij aankomst…"></textarea></div><div class="order-summary">${cart.map(l=>`<div class="row"><span>${l.qty}× ${esc(l.name)}</span><strong>${euro(l.qty*l.unitPrice)}</strong></div>`).join('')}<div class="row grand"><span>Totaal</span><strong>${euro(cartTotal())}</strong></div></div>${connected&&!databaseTestMode?'<div class="notice">Na bevestigen word je doorgestuurd naar de beveiligde betaalpagina van Stripe. Het restaurant ontvangt de bestelling als betaald zodra Stripe de betaling bevestigt.</div>':databaseTestMode?'<div class="notice warning">Database testmodus: deze order wordt echt in Supabase opgeslagen, maar er wordt nog geen betaling gestart.</div>':'<div class="notice warning">Demo: betaling is nog niet gekoppeld.</div>'}<button id="checkoutSubmit" class="primary" type="submit">${connected&&!databaseTestMode?`Naar betaling · ${euro(cartTotal())}`:databaseTestMode?'Testorder naar restaurant':'Bestelling testen'}</button></form>`}
function setType(t){orderType=t;renderCheckout()}
function formPayload(){const f=new FormData(document.getElementById('checkoutForm'));return{customer:{name:f.get('name')?.trim(),phone:f.get('phone')?.trim(),email:f.get('email')?.trim()||null},orderType,address:orderType==='delivery'?f.get('address')?.trim():null,city:orderType==='delivery'?f.get('city')?.trim():null,requestedTime:f.get('requestedTime')||null,notes:f.get('notes')?.trim()||null,items:cart.map(l=>({productId:l.productId,qty:l.qty,selections:l.selections.map(g=>({key:g.key,title:g.title,chosen:g.chosen.map(x=>({label:x.label,raw:x.raw,extra:x.extra}))}))}))}}
async function submitOrder(e){e.preventDefault();if(!cart.length)return;const payload=formPayload();if(!payload.customer.name||!payload.customer.phone)return;if(orderType==='delivery'&&(!payload.address||!payload.city)){showToast('Vul het bezorgadres in');return}if(!connected){return submitDemoOrder(payload)}if(databaseTestMode){return submitDatabaseTestOrder(payload)}const btn=document.getElementById('checkoutSubmit');btn.disabled=true;btn.textContent='Betaling voorbereiden…';try{const res=await fetch(`${cfg.SUPABASE_URL}/functions/v1/create-checkout`,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||!data.checkoutUrl)throw new Error(data.error||'Checkout mislukt');window.location.assign(data.checkoutUrl)}catch(err){console.error(err);showToast(err.message||'Betaling kon niet starten');btn.disabled=false;btn.textContent=`Naar betaling · ${euro(cartTotal())}`}}
function submitDemoOrder(payload){const no=Math.floor(10000+Math.random()*89999);cart=[];save();toggle('checkoutOverlay',false);document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">✓</div><h3>Demo-bestelling opgeslagen</h3><div class="order-no">GT-${no}</div><p class="details">${esc(payload.customer.name)} · ${orderType==='pickup'?'Afhalen':'Bezorgen'} · ${euro(cartTotal())}</p><div class="notice warning">Dit is nog een lokale demo. Koppel eerst Supabase en Stripe.</div><button class="primary" onclick="toggle('successOverlay',false)">Klaar</button></div>`;toggle('successOverlay',true)}
async function submitDatabaseTestOrder(payload){const btn=document.getElementById('checkoutSubmit');btn.disabled=true;btn.textContent='Opslaan in database…';try{const data=await api('/rest/v1/rpc/create_test_order',{method:'POST',body:JSON.stringify({p_payload:payload})});const r=Array.isArray(data)?data[0]:data;if(!r?.order_number)throw new Error('Database gaf geen ordernummer terug');const totalBeforeClear=cartTotal();cart=[];save();toggle('checkoutOverlay',false);document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">✓</div><h3>Order staat in Supabase</h3><div class="order-no">GT-${String(r.order_number).padStart(5,'0')}</div><p class="details">${esc(payload.customer.name)} · ${orderType==='pickup'?'Afhalen':'Bezorgen'} · ${euro((r.total_cents??Math.round(totalBeforeClear*100))/100)}</p><div class="notice warning">Database-test: nog niet betaald. Open nu het restaurantdashboard; deze bestelling moet daar als <strong>Niet betaald</strong> verschijnen.</div><button class="primary" onclick="toggle('successOverlay',false)">Klaar</button></div>`;toggle('successOverlay',true);showToast('Bestelling opgeslagen in Supabase')}catch(err){console.error(err);showToast(err.message||'Opslaan in database mislukt');btn.disabled=false;btn.textContent='Testorder naar restaurant'}}
function closeOnBackdrop(id){document.getElementById(id).onclick=e=>{if(e.target.id===id)toggle(id,false)}}['productOverlay','cartOverlay','checkoutOverlay','successOverlay'].forEach(closeOnBackdrop);document.getElementById('openCart').onclick=openCart;document.getElementById('search').oninput=renderMenu;renderCategories();renderMenu();renderCartBar();document.getElementById('systemStatus').textContent=connected?'● Verbinden…':'● Demo';loadRemoteMenu();
async function handlePaymentReturn(){const q=new URLSearchParams(location.search);const state=q.get('payment');if(state==='cancelled'){showToast('Betaling geannuleerd · winkelmandje is bewaard');history.replaceState({},'',location.pathname);return}if(state!=='success'||!connected)return;const sessionId=q.get('session_id');if(!sessionId)return;document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">⌛</div><h3>Betaling controleren…</h3><p class="details">Even controleren of Stripe de betaling heeft bevestigd.</p></div>`;toggle('successOverlay',true);try{const res=await fetch(`${cfg.SUPABASE_URL}/functions/v1/order-status?session_id=${encodeURIComponent(sessionId)}`,{headers:{'apikey':cfg.SUPABASE_PUBLISHABLE_KEY}});const o=await res.json();if(!res.ok)throw new Error(o.error||'Bestelling niet gevonden');if(o.paymentStatus==='paid'){cart=[];save();document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">✓</div><h3>Betaling ontvangen</h3><div class="order-no">GT-${String(o.orderNumber).padStart(5,'0')}</div><p class="details">${o.customerName} · ${o.orderType==='pickup'?'Afhalen':'Bezorgen'} · ${euro(o.totalCents/100)}</p><div class="notice">Je bestelling is ontvangen door Grill Time en staat nu in het restaurantdashboard.</div><button class="primary" onclick="toggle('successOverlay',false)">Klaar</button></div>`}else{throw new Error('Betaling is nog niet bevestigd')}}catch(err){document.getElementById('successSheet').innerHTML=`<div class="success"><div class="success-icon">!</div><h3>Betaling wordt nagekeken</h3><p class="details">${err.message}</p><div class="notice warning">De betaling wordt automatisch verder verwerkt door Stripe.</div><button class="primary" onclick="location.reload()">Opnieuw controleren</button></div>`}finally{history.replaceState({},'',location.pathname)}}
handlePaymentReturn();
</script>
</body>
</html>
