<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Grill Time Restaurant Dashboard</title>
  <style>
    :root{--bg:#0f0f0f;--panel:#191919;--panel2:#222;--gold:#f5b44b;--muted:#aaa;--line:#333;--green:#38cf76;--red:#ff7b7b;--blue:#77b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1120px;margin:auto;padding:22px 16px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{color:var(--gold);font-size:25px;margin:0}.head small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#111}.dark{background:#222;color:#fff;border:1px solid #3a3a3a}.login{max-width:460px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.login h1{margin:0 0 5px;color:var(--gold)}.login p{color:var(--muted);line-height:1.5}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:#ddd}.field input{background:#111;border:1px solid #3b3b3b;color:#fff;border-radius:11px;padding:12px;outline:none}.field input:focus{border-color:var(--gold)}.msg{padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.warn{background:#2d2516;border:1px solid #604d22;color:#ffe7ae}.ok{background:#173421;border:1px solid #2f6841;color:#c9ffda}.bad{background:#351b1b;border:1px solid #6f3535;color:#ffd0d0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;color:var(--gold);margin-top:7px}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.filter{white-space:nowrap;border:1px solid #3a3a3a;background:#1b1b1b;color:#ddd;border-radius:999px;padding:9px 12px;cursor:pointer}.filter.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:900}.order{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.order.new{border-color:#665020;box-shadow:0 0 0 1px rgba(245,180,75,.08)}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-code{font-size:19px;color:var(--gold);font-weight:900}.price{font-size:19px;font-weight:900}.meta{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.45}.payment-paid{color:var(--green);font-weight:800}.payment-unpaid{color:var(--red);font-weight:800}.items{margin:13px 0;border-top:1px solid #2d2d2d;border-bottom:1px solid #2d2d2d;padding:10px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.row small{display:block;color:#aaa;line-height:1.35;margin-top:3px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status button{background:#222;color:white;border:1px solid #444;border-radius:9px;padding:8px 10px;cursor:pointer}.status button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:bold}.empty{text-align:center;color:var(--muted);padding:60px 10px}.live{display:inline-flex;align-items:center;gap:6px;color:#bfffd2;background:#173421;border:1px solid #2f6841;padding:6px 9px;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.order-top{flex-direction:column}.price{align-self:flex-end}.stat strong{font-size:20px}}
  </style>
</head>
<body>
<div id="loginView" class="login hidden">
  <h1>Grill Time Dashboard</h1>
  <p>Alleen voor restaurantbeheer. Log in met je Supabase admin-account.</p>
  <div id="loginModeNote" class="msg warn hidden"></div>
  <form id="loginForm">
    <div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username"></div>
    <div class="field"><label>Wachtwoord</label><input id="password" type="password" required autocomplete="current-password"></div>
    <button class="btn gold" style="width:100%;padding:13px" type="submit">Inloggen</button>
  </form>
  <div id="loginMsg"></div>
</div>
<div id="dashboardView" class="wrap hidden">
  <div class="head">
    <div><h1>Grill Time · Restaurant Dashboard</h1><small id="subtitle">Bestellingen en omzet</small></div>
    <div class="actions"><span id="liveBadge" class="live"><span class="dot"></span> Live</span><button class="btn dark" onclick="loadOrders()">Vernieuwen</button><button id="logoutBtn" class="btn dark">Uitloggen</button></div>
  </div>
  <div id="stats" class="stats"></div>
  <div id="filters" class="filters"></div>
  <div id="orders"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.GT_CONFIG = {
  SUPABASE_URL: 'https://qpaycwrhohunpfjqmlga.supabase.co',
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_lEAgOU350gcdQdI_zYVDAQ_6p7uNeYM',
  CONNECTED_MODE: true
};
</script>
<script>
const cfg=window.GT_CONFIG||{};const connected=Boolean(cfg.CONNECTED_MODE&&cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.includes('YOUR_PROJECT')&&cfg.SUPABASE_PUBLISHABLE_KEY&&!cfg.SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'));const sb=connected?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;const euroCents=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format((Number(n)||0)/100);const statusLabel={pending_payment:'Wacht betaling',new:'Nieuw',preparing:'Bezig',ready:'Klaar',completed:'Afgehaald / afgerond',cancelled:'Geannuleerd'};let orders=[];let currentFilter='active';let realtimeChannel=null;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function show(id,yes){document.getElementById(id).classList.toggle('hidden',!yes)}
function loginMessage(text,type='bad'){document.getElementById('loginMsg').innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:''}
async function start(){if(!connected){show('loginView',true);document.getElementById('loginModeNote').textContent='Deze V3 staat nog in demo-modus.';show('loginModeNote',true);document.getElementById('loginForm').classList.add('hidden');return}const {data:{session}}=await sb.auth.getSession();if(session)await enterDashboard();else show('loginView',true)}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMessage('');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMessage(error.message);await enterDashboard()});
document.getElementById('logoutBtn').onclick=async()=>{if(realtimeChannel)await sb.removeChannel(realtimeChannel);await sb.auth.signOut();location.reload()};
async function enterDashboard(){const {data:admin,error}=await sb.from('restaurant_admins').select('display_name').maybeSingle();if(error||!admin){await sb.auth.signOut();show('loginView',true);show('dashboardView',false);loginMessage('Dit account heeft geen restaurant-admin toegang.','bad');return}show('loginView',false);show('dashboardView',true);document.getElementById('subtitle').textContent=`Ingelogd als ${admin.display_name}`;await loadOrders();subscribeRealtime()}
async function loadOrders(){if(!connected)return;const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(150);if(error){document.getElementById('orders').innerHTML=`<div class="msg bad">${esc(error.message)}</div>`;return}orders=data||[];render()}
function subscribeRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('restaurant-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe()}
function filterList(){return [{id:'active',label:'Actief'},{id:'pending_payment',label:'Wacht betaling'},{id:'new',label:'Nieuw'},{id:'preparing',label:'Bezig'},{id:'ready',label:'Klaar'},{id:'completed',label:'Afgerond'},{id:'all',label:'Alles'}]}
function render(){const today=new Date();const todayOrders=orders.filter(o=>new Date(o.created_at).toDateString()===today.toDateString());const paid=orders.filter(o=>o.payment_status==='paid');const todayPaid=paid.filter(o=>{const d=new Date(o.paid_at||o.created_at);return d.toDateString()===today.toDateString()});const revenue=todayPaid.reduce((s,o)=>s+Number(o.total_cents||0),0);const avg=todayPaid.length?revenue/todayPaid.length:0;const active=orders.filter(o=>['pending_payment','new','preparing','ready'].includes(o.status));document.getElementById('stats').innerHTML=`<div class="stat"><small>Orders vandaag</small><strong>${todayOrders.length}</strong></div><div class="stat"><small>Betaalde omzet vandaag</small><strong>${euroCents(revenue)}</strong></div><div class="stat"><small>Gem. betaalde order</small><strong>${euroCents(avg)}</strong></div><div class="stat"><small>Actieve orders</small><strong>${active.length}</strong></div>`;document.getElementById('filters').innerHTML=filterList().map(f=>`<button class="filter ${f.id===currentFilter?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('');let list=orders;if(currentFilter==='active')list=orders.filter(o=>['pending_payment','new','preparing','ready'].includes(o.status));else if(currentFilter!=='all')list=orders.filter(o=>o.status===currentFilter);document.getElementById('orders').innerHTML=list.length?list.map(orderHtml).join(''):`<div class="empty">Geen bestellingen in deze categorie.</div>`}
function setFilter(f){currentFilter=f;render()}
function orderHtml(o){const dt=new Date(o.created_at).toLocaleString('nl-BE');const code=`GT-${String(o.order_number).padStart(5,'0')}`;const location=o.order_type==='pickup'?'Afhalen':`Bezorgen · ${esc([o.address_line,o.city].filter(Boolean).join(', '))}`;return `<article class="order ${o.status==='new'?'new':''}"><div class="order-top"><div><div class="order-code">${code}</div><div class="meta">${dt} · ${location} · ${esc(o.requested_time||'')}</div><div class="meta">${esc(o.customer_name)} · ${esc(o.customer_phone)}${o.customer_email?` · ${esc(o.customer_email)}`:''}</div><div class="meta ${o.payment_status==='paid'?'payment-paid':'payment-unpaid'}">${o.payment_status==='paid'?'✓ Betaald':'Niet betaald'}</div></div><div class="price">${euroCents(o.total_cents)}</div></div><div class="items">${(o.order_items||[]).map(i=>`<div class="row"><span>${i.quantity}× ${esc(i.product_name)}${Array.isArray(i.details)&&i.details.length?`<small>${i.details.map(esc).join(' · ')}</small>`:''}</span><span>${euroCents(i.line_total_cents)}</span></div>`).join('')}</div>${o.notes?`<div class="msg warn"><strong>Opmerking:</strong> ${esc(o.notes)}</div>`:''}<div class="status">${['new','preparing','ready','completed'].map(s=>`<button class="${o.status===s?'active':''}" onclick="setStatus('${o.id}','${s}')">${statusLabel[s]}</button>`).join('')}</div></article>`}
async function setStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else await loadOrders()}
start();
</script>
</body>
</html>
