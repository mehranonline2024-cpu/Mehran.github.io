<script>
const cfg=window.GT_CONFIG||{};const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const euroCents=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format((Number(n)||0)/100);const statusLabel={pending_payment:'Wacht betaling',new:'Nieuw',preparing:'Bezig',ready:'Klaar',completed:'Afgerond',cancelled:'Geannuleerd'};let orders=[],currentFilter='active',realtimeChannel=null,firstOrderLoad=true,knownAlertIds=new Set(),audioCtx=null,soundEnabled=false,pollTimer=null,loadInFlight=false,alarmBuffer=null,alarmRepeatTimer=null,currentMfaFactorId=null;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function show(id,yes){document.getElementById(id).classList.toggle('hidden',!yes)}function loginMessage(t){document.getElementById('loginMsg').innerHTML=t?`<div class="msg bad">${esc(t)}</div>`:''}function mfaMessage(t,type='bad'){const e=document.getElementById('mfaMsg');if(e)e.innerHTML=t?`<div class="msg ${type}">${esc(t)}</div>`:''}
function updateSoundButton(){const b=document.getElementById('soundBtn');b.textContent=soundEnabled?'🔊 Alarm aan · 5 sec pauze':'🔔 Geluid aan';b.classList.toggle('sound-on',soundEnabled);b.classList.toggle('sound-off',!soundEnabled)}
function buildAlarmBuffer(){if(alarmBuffer)return alarmBuffer;const sr=audioCtx.sampleRate,duration=.42,len=Math.floor(sr*duration),buffer=audioCtx.createBuffer(1,len,sr),data=buffer.getChannelData(0),f=1750;for(let i=0;i<len;i++){const x=i/sr,pos=i/len,env=Math.min(1,pos/.08,(1-pos)/.18),square1=Math.sin(2*Math.PI*f*x)>=0?1:-1,square2=Math.sin(2*Math.PI*(f*2)*x)>=0?1:-1,sine=Math.sin(2*Math.PI*(f*.5)*x);data[i]=Math.max(-1,Math.min(1,(.78*square1+.25*square2+.15*sine)*Math.max(0,env)*1.3))}alarmBuffer=buffer;return buffer}
function createAlarmSource(){const src=audioCtx.createBufferSource(),gain=audioCtx.createGain(),compressor=audioCtx.createDynamicsCompressor();src.buffer=buildAlarmBuffer();gain.gain.value=1.45;compressor.threshold.value=-10;compressor.knee.value=2;compressor.ratio.value=4;compressor.attack.value=.002;compressor.release.value=.08;src.connect(gain);gain.connect(compressor);compressor.connect(audioCtx.destination);return src}
async function playAlarmOnce(){if(!soundEnabled||!audioCtx)return;try{if(audioCtx.state==='suspended')await audioCtx.resume();createAlarmSource().start()}catch(e){console.error(e)}}
function isAlertOrder(o){return o.status==='new'&&(o.payment_status==='paid'||o.payment_method==='cash')}function hasAlertOrder(){return orders.some(isAlertOrder)}function stopAlarmReminder(){if(alarmRepeatTimer){clearInterval(alarmRepeatTimer);alarmRepeatTimer=null}}function startAlarmReminder(playImmediately=false){if(!soundEnabled||!hasAlertOrder()){stopAlarmReminder();return}if(playImmediately)playAlarmOnce();if(alarmRepeatTimer)return;alarmRepeatTimer=setInterval(()=>{if(soundEnabled&&hasAlertOrder())playAlarmOnce();else stopAlarmReminder()},5500)}function syncAlarmReminder(fresh=false){if(soundEnabled&&hasAlertOrder())startAlarmReminder(fresh);else stopAlarmReminder()}
async function toggleSound(){if(soundEnabled){soundEnabled=false;stopAlarmReminder();localStorage.setItem('gt-admin-sound','off');updateSoundButton();return}try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();soundEnabled=true;localStorage.setItem('gt-admin-sound','on');updateSoundButton();if(hasAlertOrder())startAlarmReminder(true);else playAlarmOnce()}catch(e){soundEnabled=false;updateSoundButton()}}
function showNewOrderAlert(){const el=document.getElementById('alertToast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500)}function detectFresh(next){const current=new Set(next.filter(isAlertOrder).map(o=>o.id));if(firstOrderLoad){knownAlertIds=current;firstOrderLoad=false;return false}const fresh=[...current].filter(id=>!knownAlertIds.has(id));knownAlertIds=current;if(fresh.length)showNewOrderAlert();return fresh.length>0}function updateTabTitle(){const n=orders.filter(isAlertOrder).length;document.title=n?`(${n}) Nieuwe bestelling${n===1?'':'en'} · Grill Time`:'Grill Time Restaurant Dashboard'}
async function isRestaurantAdmin(){const {data,error}=await sb.from('restaurant_admins').select('display_name').maybeSingle();return {ok:!error&&!!data,admin:data,error}}
async function start(){updateSoundButton();const {data:{session}}=await sb.auth.getSession();if(session)await afterPasswordLogin();else show('loginView',true)}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMessage('');const btn=e.submitter;btn.disabled=true;btn.textContent='Controleren…';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){btn.disabled=false;btn.textContent='Inloggen';return loginMessage('E-mail of wachtwoord is niet correct.')}await afterPasswordLogin();btn.disabled=false;btn.textContent='Inloggen'});
document.getElementById('logoutBtn').onclick=logoutAll;
async function logoutAll(){if(realtimeChannel){await sb.removeChannel(realtimeChannel);realtimeChannel=null}if(pollTimer){clearInterval(pollTimer);pollTimer=null}stopAlarmReminder();await sb.auth.signOut();location.reload()}
async function afterPasswordLogin(){show('loginView',false);show('dashboardView',false);show('mfaView',false);const a=await isRestaurantAdmin();if(!a.ok){await sb.auth.signOut();show('loginView',true);loginMessage('Dit account heeft geen restaurant-admin toegang.');return}await requireMfa(a.admin)}
async function requireMfa(admin){const {data:aal,error:aalError}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aalError){show('mfaView',true);document.getElementById('mfaContent').innerHTML=`<h1>Beveiligingscontrole</h1><div class="msg bad">MFA-status kon niet worden gecontroleerd.</div><button class="btn dark" onclick="logoutAll()">Uitloggen</button>`;return}if(aal?.currentLevel==='aal2'){await enterDashboard(admin);return}const {data:factors,error:fError}=await sb.auth.mfa.listFactors();if(fError){show('mfaView',true);document.getElementById('mfaContent').innerHTML=`<h1>Beveiligingscontrole</h1><div class="msg bad">Authenticator kon niet worden geladen.</div><button class="btn dark" onclick="logoutAll()">Uitloggen</button>`;return}const verified=(factors?.totp||[]).find(f=>f.status==='verified');if(verified){showMfaChallenge(verified.id);return}for(const f of (factors?.totp||[]).filter(x=>x.status!=='verified')){try{await sb.auth.mfa.unenroll({factorId:f.id})}catch(_){}}await beginMfaEnrollment()}
function showMfaChallenge(factorId){currentMfaFactorId=factorId;show('mfaView',true);document.getElementById('mfaContent').innerHTML=`<h1>Authenticator-code</h1><p>Open je Authenticator-app en vul de actuele 6-cijferige code in.</p><form id="mfaForm"><div class="field"><label>6-cijferige code</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required></div><button class="btn gold" style="width:100%;padding:13px" type="submit">Veilig inloggen</button></form><div id="mfaMsg"></div><div class="mfa-actions"><button class="btn dark" onclick="logoutAll()">Uitloggen</button></div>`;document.getElementById('mfaForm').onsubmit=verifyMfaCode;setTimeout(()=>document.getElementById('mfaCode')?.focus(),100)}
async function beginMfaEnrollment(){show('mfaView',true);document.getElementById('mfaContent').innerHTML=`<h1>Authenticator instellen</h1><p>Eenmalige beveiligingsinstelling laden…</p>`;const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Grill Time Admin'});if(error||!data?.id||!data?.totp){document.getElementById('mfaContent').innerHTML=`<h1>Authenticator instellen</h1><div class="msg bad">Instellen mislukt. Log opnieuw in en probeer opnieuw.</div><button class="btn dark" onclick="logoutAll()">Uitloggen</button>`;return}currentMfaFactorId=data.id;const qr=data.totp.qr_code||'';const secret=data.totp.secret||'';document.getElementById('mfaContent').innerHTML=`<h1>Authenticator instellen</h1><p><strong>Eenmalig:</strong> scan deze QR-code met Google Authenticator, Authy, 1Password of een andere TOTP-app.</p><div class="qr-wrap"><img src="${esc(qr)}" alt="Authenticator QR-code"></div><p style="font-size:13px">Kan je niet scannen? Voeg deze sleutel handmatig toe:</p><div class="secret">${esc(secret)}</div><form id="mfaForm"><div class="field"><label>Vul daarna de 6-cijferige code in</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required></div><button class="btn gold" style="width:100%;padding:13px" type="submit">Authenticator bevestigen</button></form><div id="mfaMsg"></div><div class="msg warn">Bewaar toegang tot je Authenticator veilig. Supabase geeft geen klassieke recovery-codes voor TOTP.</div><div class="mfa-actions"><button class="btn dark" onclick="logoutAll()">Later / Uitloggen</button></div>`;document.getElementById('mfaForm').onsubmit=verifyMfaCode}
async function verifyMfaCode(e){e.preventDefault();const code=String(document.getElementById('mfaCode')?.value||'').replace(/\D/g,'').slice(0,6);if(code.length!==6)return mfaMessage('Vul een geldige code van 6 cijfers in.');const btn=e.submitter;btn.disabled=true;btn.textContent='Controleren…';mfaMessage('');const {error}=await sb.auth.mfa.challengeAndVerify({factorId:currentMfaFactorId,code});if(error){btn.disabled=false;btn.textContent='Opnieuw proberen';return mfaMessage('De code is niet correct of verlopen. Probeer de nieuwe code uit je app.')}await sb.auth.refreshSession();const a=await isRestaurantAdmin();if(!a.ok){await logoutAll();return}const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal?.currentLevel!=='aal2'){btn.disabled=false;btn.textContent='Opnieuw proberen';return mfaMessage('De tweede beveiligingsstap kon niet worden bevestigd.')}show('mfaView',false);await enterDashboard(a.admin)}
async function enterDashboard(admin){const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal?.currentLevel!=='aal2'){await requireMfa(admin);return}show('loginView',false);show('mfaView',false);show('dashboardView',true);document.getElementById('subtitle').textContent=`Ingelogd als ${admin.display_name} · MFA beveiligd`;await loadOrders();subscribeRealtime();if(!pollTimer)pollTimer=setInterval(loadOrders,5000)}
async function loadOrders(){if(loadInFlight)return;loadInFlight=true;try{const {data,error}=await sb.from('orders').select('*,order_items(id,quantity,product_name,line_total_cents,details,item_note)').order('created_at',{ascending:false}).limit(150);if(error){document.getElementById('orders').innerHTML=`<div class="msg bad">Toegang geweigerd of orders konden niet worden geladen.</div>`;return}const fresh=detectFresh(data||[]);orders=data||[];render();updateTabTitle();syncAlarmReminder(fresh)}finally{loadInFlight=false}}
function subscribeRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('restaurant-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>setTimeout(loadOrders,200)).on('postgres_changes',{event:'*',schema:'public',table:'order_items'},()=>setTimeout(loadOrders,150)).subscribe()}
function filterList(){return[{id:'active',label:'Actief'},{id:'new',label:'Nieuw'},{id:'preparing',label:'Bezig'},{id:'ready',label:'Klaar'},{id:'completed',label:'Afgerond'},{id:'all',label:'Alles'}]}
function render(){const today=new Date();const todayOrders=orders.filter(o=>new Date(o.created_at).toDateString()===today.toDateString());const paid=orders.filter(o=>o.payment_status==='paid');const todayPaid=paid.filter(o=>new Date(o.paid_at||o.created_at).toDateString()===today.toDateString());const revenue=todayPaid.reduce((s,o)=>s+Number(o.total_cents||0),0),avg=todayPaid.length?revenue/todayPaid.length:0,active=orders.filter(o=>['pending_payment','new','preparing','ready'].includes(o.status));document.getElementById('stats').innerHTML=`<div class="stat"><small>Orders vandaag</small><strong>${todayOrders.length}</strong></div><div class="stat"><small>Betaalde omzet vandaag</small><strong>${euroCents(revenue)}</strong></div><div class="stat"><small>Gem. betaalde order</small><strong>${euroCents(avg)}</strong></div><div class="stat"><small>Actieve orders</small><strong>${active.length}</strong></div>`;document.getElementById('filters').innerHTML=filterList().map(f=>`<button class="filter ${f.id===currentFilter?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('');let list=currentFilter==='all'?orders:currentFilter==='active'?active:orders.filter(o=>o.status===currentFilter);document.getElementById('orders').innerHTML=list.length?list.map(orderHtml).join(''):'<div class="empty">Geen bestellingen in deze categorie.</div>'}function setFilter(f){currentFilter=f;render()}
function orderHtml(o){const dt=new Date(o.created_at).toLocaleString('nl-BE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),code=`GT-${String(o.order_number).padStart(5,'0')}`,type=o.order_type==='pickup'?'Afhalen':'Bezorgen',address=o.order_type==='delivery'?[o.address_line,o.city].filter(Boolean).join(', '):'Afhalen in restaurant',isCash=o.payment_method==='cash',isNew=o.status==='new';let payText=o.payment_status==='paid'?(isCash?'Cash ontvangen':'Online betaald'):(isCash?'Cash te ontvangen':'Niet betaald');let payClass=o.payment_status==='paid'?'pay-paid':isCash?'pay-cash':'pay-unpaid';const distance=o.order_type==='delivery'&&o.delivery_distance_km!=null?`${Number(o.delivery_distance_km).toFixed(2).replace('.',',')} km rijafstand`:'—',fee=o.order_type==='delivery'?(Number(o.delivery_fee_cents||0)===0?'Gratis':euroCents(o.delivery_fee_cents)):'—',discount=Number(o.discount_cents||0);return `<article class="order ${isNew?'new':''}">${isNew?'<div class="new-order-strip"><span class="pulse-dot"></span>NIEUWE BESTELLING</div>':''}<div class="order-top"><div><div class="order-title-row"><span class="order-code">${code}</span><span class="status-badge status-${esc(o.status)}">${esc(statusLabel[o.status]||o.status)}</span><span class="type-badge">${type}</span><span class="pay-badge ${payClass}">${esc(payText)}</span>${discount>0?'<span class="discount-badge">WELCOME10</span>':''}</div></div><div class="price">${euroCents(o.total_cents)}</div></div><div class="meta-grid"><div class="meta-box"><div class="meta-label">Tijd</div><div class="meta-value">${dt} · ${esc(o.requested_time||'Zo snel mogelijk')}</div></div><div class="meta-box"><div class="meta-label">Klant</div><div class="meta-value"><strong>${esc(o.customer_name)}</strong><br>${esc(o.customer_phone)}</div></div><div class="meta-box"><div class="meta-label">${type}</div><div class="meta-value">${esc(address)}${o.order_type==='delivery'?`<br><strong>${distance} · ${fee} bezorging</strong>`:''}</div></div><div class="meta-box"><div class="meta-label">Betaling</div><div class="meta-value">${isCash?'💶 Cash':'💳 Online'}<br>${esc(payText)}</div></div></div><div class="items"><div class="items-title">Bestelling</div>${(o.order_items||[]).map(i=>`<div class="row"><span><span class="item-name">${i.quantity}× ${esc(i.product_name)}</span>${Array.isArray(i.details)&&i.details.length?`<small>${i.details.map(esc).join(' · ')}</small>`:''}${i.item_note?`<span class="item-note-admin"><strong>Opmerking gerecht:</strong> ${esc(i.item_note)}</span>`:''}</span><strong>${euroCents(i.line_total_cents)}</strong></div>`).join('')}</div><div class="totals-admin"><div class="total-line"><span>Producten</span><span>${euroCents(o.subtotal_cents)}</span></div>${discount>0?`<div class="total-line" style="color:#aef6cf"><span>Welkomstkorting 10%</span><span>− ${euroCents(discount)}</span></div>`:''}${o.order_type==='delivery'?`<div class="total-line"><span>Bezorging</span><span>${fee}</span></div>`:''}<div class="total-line grand"><span>Totaal</span><span>${euroCents(o.total_cents)}</span></div></div>${o.notes?`<div class="msg warn"><strong>Opmerking bestelling:</strong> ${esc(o.notes)}</div>`:''}${isCash&&o.payment_status!=='paid'?`<div class="cash-action"><button onclick="markCashPaid('${o.id}')">💶 Cash ontvangen · ${euroCents(o.total_cents)}</button><span style="color:#aaa;font-size:12px">Klik pas nadat het geld is ontvangen.</span></div>`:''}<div class="status">${['new','preparing','ready','completed'].map(s=>`<button class="${o.status===s?'active':''}" onclick="setStatus('${o.id}','${s}')">${statusLabel[s]}</button>`).join('')}</div></article>`}
async function setStatus(id,status){const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal?.currentLevel!=='aal2')return afterPasswordLogin();const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert('Actie geweigerd. Log opnieuw in met Authenticator.');else await loadOrders()}async function markCashPaid(id){if(!confirm('Cash werkelijk ontvangen?'))return;const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal?.currentLevel!=='aal2')return afterPasswordLogin();const {error}=await sb.rpc('mark_cash_order_paid',{p_order_id:id});if(error)alert('Actie geweigerd. Controleer je MFA-login.');else await loadOrders()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.getElementById('dashboardView')&&!document.getElementById('dashboardView').classList.contains('hidden'))loadOrders()});start();
</script></body></html>
