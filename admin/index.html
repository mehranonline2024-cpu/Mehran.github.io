<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://qpaycwrhohunpfjqmlga.supabase.co wss://qpaycwrhohunpfjqmlga.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Grill Time Restaurant Dashboard</title>
  <style>
    :root{--bg:#0c0c0c;--panel:#171717;--panel2:#202020;--gold:#f5b44b;--gold2:#ffd177;--muted:#9d9d9d;--line:#2d2d2d;--green:#45d27a;--red:#ff7b7b;--blue:#77b8ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(245,180,75,.07),transparent 28%),var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px 16px 70px}
    .head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 0 8px}.head h1{color:var(--gold);font-size:27px;margin:0;letter-spacing:-.5px}.head small{color:var(--muted);display:block;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#111}.dark{background:#202020;color:#fff;border:1px solid #383838}.dark:hover{border-color:#5a5a5a}
    .login{max-width:460px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.login h1{margin:0 0 5px;color:var(--gold)}.login p{color:var(--muted);line-height:1.5}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:#ddd}.field input{background:#111;border:1px solid #3b3b3b;color:#fff;border-radius:11px;padding:12px;outline:none}.field input:focus{border-color:var(--gold)}
    .msg{padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.warn{background:#2d2516;border:1px solid #604d22;color:#ffe7ae}.ok{background:#173421;border:1px solid #2f6841;color:#c9ffda}.bad{background:#351b1b;border:1px solid #6f3535;color:#ffd0d0}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:linear-gradient(180deg,#191919,#151515);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;color:var(--gold);margin-top:7px;letter-spacing:-.4px}
    .filters{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #393939;background:#181818;color:#d5d5d5;border-radius:999px;padding:9px 13px;cursor:pointer}.filter.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:900}
    .order{background:linear-gradient(180deg,#181818,#151515);border:1px solid var(--line);border-radius:19px;padding:17px;margin:13px 0;box-shadow:0 8px 26px rgba(0,0,0,.14)}.order.new{border-color:#7a5d27;box-shadow:0 0 0 1px rgba(245,180,75,.08),0 10px 30px rgba(0,0,0,.18)}.order-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.order-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.order-code{font-size:21px;color:var(--gold);font-weight:950}.price{font-size:22px;font-weight:950;white-space:nowrap}.status-badge,.type-badge,.pay-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;letter-spacing:.03em}.status-new{background:#342a17;color:#ffe1a0;border:1px solid #715621}.status-preparing{background:#17283a;color:#add5ff;border:1px solid #315f88}.status-ready{background:#173421;color:#bfffd2;border:1px solid #2f6841}.status-completed{background:#222;color:#c7c7c7;border:1px solid #444}.status-pending_payment{background:#38231d;color:#ffc0a8;border:1px solid #744535}.type-badge{background:#202020;border:1px solid #383838;color:#ddd}.pay-paid{background:#173421;color:#bfffd2;border:1px solid #2f6841}.pay-unpaid{background:#351b1b;color:#ffd0d0;border:1px solid #6f3535}
    .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.meta-box{background:#111;border:1px solid #292929;border-radius:11px;padding:10px 11px}.meta-label{font-size:10px;color:#737373;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:3px}.meta-value{font-size:13px;color:#ddd;line-height:1.4;word-break:break-word}
    .items{margin:14px 0 0;border-top:1px solid #2b2b2b;padding-top:7px}.items-title{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:900;padding:4px 0 7px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #242424}.row:first-of-type{border-top:0}.item-name{font-weight:850}.row small{display:block;color:#aaa;line-height:1.4;margin-top:4px}.item-note-admin{display:block;margin-top:7px;padding:8px 9px;border-radius:9px;background:#2d2516;border:1px solid #604d22;color:#ffe7ae;font-size:12px;line-height:1.35}.order-note{margin-top:12px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;border-top:1px solid #292929;padding-top:13px}.status button{background:#202020;color:white;border:1px solid #414141;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:750}.status button:hover{border-color:#6a6a6a}.status button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:900}.empty{text-align:center;color:var(--muted);padding:60px 10px}.live{display:inline-flex;align-items:center;gap:6px;color:#bfffd2;background:#173421;border:1px solid #2f6841;padding:7px 10px;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.meta-grid{grid-template-columns:1fr}.order-top{gap:8px}.price{font-size:19px}.stat strong{font-size:21px}.order{padding:14px}.order-code{font-size:19px}}@media(max-width:390px){.stats{grid-template-columns:1fr}.order-top{flex-direction:column}.price{align-self:flex-end}}
  </style>
</head>
<body>
<div id="loginView" class="login hidden"><h1>Grill Time Dashboard</h1><p>Alleen voor restaurantbeheer. Log in met je Supabase admin-account.</p><div id="loginModeNote" class="msg warn hidden"></div><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Wachtwoord</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn gold" style="width:100%;padding:13px" type="submit">Inloggen</button></form><div id="loginMsg"></div></div>
<div id="dashboardView" class="wrap hidden"><div class="head"><div><h1>Grill Time · Dashboard</h1><small id="subtitle">Bestellingen en omzet</small></div><div class="actions"><span id="liveBadge" class="live"><span class="dot"></span> Live</span><button class="btn dark" onclick="loadOrders()">↻ Vernieuwen</button><button id="logoutBtn" class="btn dark">Uitloggen</button></div></div><div id="stats" class="stats"></div><div id="filters" class="filters"></div><div id="orders"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.GT_CONFIG={SUPABASE_URL:'https://qpaycwrhohunpfjqmlga.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_lEAgOU350gcdQdI_zYVDAQ_6p7uNeYM',CONNECTED_MODE:true};</script>
<script>
const cfg=window.GT_CONFIG||{};const connected=Boolean(cfg.CONNECTED_MODE&&cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.includes('YOUR_PROJECT')&&cfg.SUPABASE_PUBLISHABLE_KEY&&!cfg.SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'));const sb=connected?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;const euroCents=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format((Number(n)||0)/100);const statusLabel={pending_payment:'Wacht betaling',new:'Nieuw',preparing:'Bezig',ready:'Klaar',completed:'Afgerond',cancelled:'Geannuleerd'};let orders=[];let currentFilter='active';let realtimeChannel=null;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function show(id,yes){document.getElementById(id).classList.toggle('hidden',!yes)}function loginMessage(text,type='bad'){document.getElementById('loginMsg').innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:''}
async function start(){if(!connected){show('loginView',true);document.getElementById('loginModeNote').textContent='Deze V3 staat nog in demo-modus.';show('loginModeNote',true);document.getElementById('loginForm').classList.add('hidden');return}const {data:{session}}=await sb.auth.getSession();if(session)await enterDashboard();else show('loginView',true)}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMessage('');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMessage(error.message);await enterDashboard()});document.getElementById('logoutBtn').onclick=async()=>{if(realtimeChannel)await sb.removeChannel(realtimeChannel);await sb.auth.signOut();location.reload()};
async function enterDashboard(){const {data:admin,error}=await sb.from('restaurant_admins').select('display_name').maybeSingle();if(error||!admin){await sb.auth.signOut();show('loginView',true);show('dashboardView',false);loginMessage('Dit account heeft geen restaurant-admin toegang.','bad');return}show('loginView',false);show('dashboardView',true);document.getElementById('subtitle').textContent=`Ingelogd als ${admin.display_name}`;await loadOrders();subscribeRealtime()}
async function loadOrders(){if(!connected)return;const {data,error}=await sb.from('orders').select('*,order_items(id,quantity,product_name,line_total_cents,details,item_note)').order('created_at',{ascending:false}).limit(150);if(error){document.getElementById('orders').innerHTML=`<div class="msg bad">${esc(error.message)}</div>`;return}orders=data||[];render()}
function subscribeRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('restaurant-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>setTimeout(loadOrders,250)).on('postgres_changes',{event:'*',schema:'public',table:'order_items'},()=>setTimeout(loadOrders,150)).subscribe()}
function filterList(){return[{id:'active',label:'Actief'},{id:'pending_payment',label:'Wacht betaling'},{id:'new',label:'Nieuw'},{id:'preparing',label:'Bezig'},{id:'ready',label:'Klaar'},{id:'completed',label:'Afgerond'},{id:'all',label:'Alles'}]}
function render(){const today=new Date();const todayOrders=orders.filter(o=>new Date(o.created_at).toDateString()===today.toDateString());const paid=orders.filter(o=>o.payment_status==='paid');const todayPaid=paid.filter(o=>{const d=new Date(o.paid_at||o.created_at);return d.toDateString()===today.toDateString()});const revenue=todayPaid.reduce((s,o)=>s+Number(o.total_cents||0),0);const avg=todayPaid.length?revenue/todayPaid.length:0;const active=orders.filter(o=>['pending_payment','new','preparing','ready'].includes(o.status));document.getElementById('stats').innerHTML=`<div class="stat"><small>Orders vandaag</small><strong>${todayOrders.length}</strong></div><div class="stat"><small>Betaalde omzet vandaag</small><strong>${euroCents(revenue)}</strong></div><div class="stat"><small>Gem. betaalde order</small><strong>${euroCents(avg)}</strong></div><div class="stat"><small>Actieve orders</small><strong>${active.length}</strong></div>`;document.getElementById('filters').innerHTML=filterList().map(f=>`<button class="filter ${f.id===currentFilter?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('');let list=orders;if(currentFilter==='active')list=orders.filter(o=>['pending_payment','new','preparing','ready'].includes(o.status));else if(currentFilter!=='all')list=orders.filter(o=>o.status===currentFilter);document.getElementById('orders').innerHTML=list.length?list.map(orderHtml).join(''):`<div class="empty">Geen bestellingen in deze categorie.</div>`}function setFilter(f){currentFilter=f;render()}
function badgeClass(status){return`status-badge status-${esc(status||'completed')}`}function orderHtml(o){const created=new Date(o.created_at);const dt=created.toLocaleString('nl-BE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});const code=`GT-${String(o.order_number).padStart(5,'0')}`;const type=o.order_type==='pickup'?'Afhalen':'Bezorgen';const address=o.order_type==='delivery'?[o.address_line,o.city].filter(Boolean).join(', '):'Afhalen in restaurant';const payment=o.payment_status==='paid'?'Betaald':'Niet betaald';return `<article class="order ${o.status==='new'?'new':''}"><div class="order-top"><div><div class="order-title-row"><span class="order-code">${code}</span><span class="${badgeClass(o.status)}">${esc(statusLabel[o.status]||o.status)}</span><span class="type-badge">${type}</span><span class="pay-badge ${o.payment_status==='paid'?'pay-paid':'pay-unpaid'}">${payment}</span></div></div><div class="price">${euroCents(o.total_cents)}</div></div><div class="meta-grid"><div class="meta-box"><div class="meta-label">Tijd</div><div class="meta-value">${dt} · ${esc(o.requested_time||'Zo snel mogelijk')}</div></div><div class="meta-box"><div class="meta-label">Klant</div><div class="meta-value"><strong>${esc(o.customer_name)}</strong><br>${esc(o.customer_phone)}${o.customer_email?`<br>${esc(o.customer_email)}`:''}</div></div><div class="meta-box"><div class="meta-label">${type}</div><div class="meta-value">${esc(address)}</div></div><div class="meta-box"><div class="meta-label">Betaling</div><div class="meta-value ${o.payment_status==='paid'?'payment-paid':'payment-unpaid'}">${o.payment_status==='paid'?'✓ Betaald':'⚠ Niet betaald'}</div></div></div><div class="items"><div class="items-title">Bestelling</div>${(o.order_items||[]).map(i=>`<div class="row"><span><span class="item-name">${i.quantity}× ${esc(i.product_name)}</span>${Array.isArray(i.details)&&i.details.length?`<small>${i.details.map(esc).join(' · ')}</small>`:''}${i.item_note?`<span class="item-note-admin"><strong>Opmerking gerecht:</strong> ${esc(i.item_note)}</span>`:''}</span><strong>${euroCents(i.line_total_cents)}</strong></div>`).join('')}</div>${o.notes?`<div class="msg warn order-note"><strong>Opmerking bestelling:</strong> ${esc(o.notes)}</div>`:''}<div class="status">${['new','preparing','ready','completed'].map(s=>`<button class="${o.status===s?'active':''}" onclick="setStatus('${o.id}','${s}')">${statusLabel[s]}</button>`).join('')}</div></article>`}
async function setStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else await loadOrders()}start();
</script></body></html>
